<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07070d">
<title>จอแสดงผลคะแนน</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-nobanner="1" class="display">
<div class="bg-fx"></div><div class="grain"></div>
<div id="bgLayer" class="bg-layer"></div>
<div class="loading"><div class="spinner"></div></div>
<div class="d-root">
  <header class="d-head">
    <div class="row-flex" style="min-width:0;flex-wrap:nowrap;gap:1.6vw">
      <img id="dLogo" class="d-logo noimg" alt="">
      <div style="min-width:0">
        <h1 class="d-title"><span class="grad-text" id="dTitle">การประกวดแบบ</span></h1>
        <div class="d-sub" id="dSub"></div>
      </div>
    </div>
    <div class="d-meta"><div id="dPill"></div><div class="count num" id="dCount"></div></div>
  </header>
  <section class="d-stage" id="stage"></section>
  <footer class="d-ticker" id="ticker"></footer>
</div>
<div class="d-tools">
  <button class="btn btn-sm" id="fs">⛶ เต็มจอ</button>
</div>
<canvas id="confetti"></canvas>
<script type="module" src="js/display.js"></script>
</body>
</html>
